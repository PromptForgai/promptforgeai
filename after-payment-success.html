<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Received — PromptForge AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0f19; --card: #121826; --text: #e2e8f0; --muted: #94a3b8; --success: #10b981; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card); border-radius: 16px; padding: 40px; max-width: 440px; width: 100%; text-align: center; }
    .icon { font-size: 3rem; color: var(--success); margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    a { color: #22d3ee; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Request received!</h1>
    <p>
      Thank you. We have received your payment confirmation.<br><br>
      Your pack will be sent to your email within a few hours after verification.
    </p>
    <a href="index.html">← Back to homepage</a>
  </div>
</body>
</html>
