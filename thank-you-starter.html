<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Starter Pack — PromptForge AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0f19; --card: #121826; --text: #e2e8f0; --muted: #94a3b8; --primary: #6366f1; --success: #10b981; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card); border-radius: 16px; padding: 40px; max-width: 480px; width: 100%; text-align: center; }
    h1 { font-size: 1.6rem; margin-bottom: 12px; }
    p { color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
    .success { color: var(--success); font-size: 3rem; margin-bottom: 16px; }
    .btn { display: inline-block; background: var(--primary); color: white; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; margin: 8px 0; }
    .btn:hover { opacity: 0.9; }
    .note { font-size: 0.9rem; margin-top: 28px; padding-top: 20px; border-top: 1px solid #1e293b; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="success">✓</div>
    <h1>Starter Pack Ready</h1>
    <p>Thank you for your purchase. Click below to download your Starter Pack (50 prompts).</p>
    
    <a class="btn" href="packs/starter-pack.pdf" download>Download Starter Pack (PDF)</a>
    
    <div class="note">
      <p>If the download doesn’t work, email your payment proof to <strong>Promptforgai@gmail.com</strong></p>
      <p style="margin-top:12px;"><a href="index.html" style="color:#22d3ee;">← Back to homepage</a></p>
    </div>
  </div>
</body>
</html>
